{% extends "base.html" %}

{% block content %}
    <div class="card">
        <h1>Nearest MBTA Station Finder</h1>
        <p class="subtitle">Enter a location to find the nearest MBTA station.</p>

        <form method="POST" action="/search">
            <input type="text" name="place" placeholder="e.g., Boston Common" required>
            <button type="submit">Search</button>
        </form>
    </div>
{% endblock %}
